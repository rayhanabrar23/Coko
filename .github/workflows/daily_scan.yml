name: IDX Daily Scan & Trade Update

on:
  schedule:
    # Berjalan otomatis Senin - Jumat pukul 09:30 UTC (= 16:30 WIB, setelah bursa tutup)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Memungkinkan eksekusi manual via web GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan agar GitHub bisa memperbarui file json secara otomatis
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas-ta yfinance pytz requests numpy

      - name: Run Daily Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python run_daily.py

      - name: Commit and Push Updated Trade Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add idx_trade_log.json
          git diff --staged --quiet || git commit -m "Auto-update trade logs and scan results [skip ci]"
          git push
